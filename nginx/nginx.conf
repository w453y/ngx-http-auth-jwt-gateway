# NGINX Configuration with JWT Authentication
# For use with w453y/ngx_http_auth_jwt_module Docker image

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Load the JWT authentication module
# Note: Path may vary depending on your NGINX installation
# Common paths: /usr/lib/nginx/modules/ or /usr/lib64/nginx/modules/
load_module modules/ngx_http_auth_jwt_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ==========================================
    # JWT Configuration (Global)
    # ==========================================
    
    # STEP 1: Generate your JWT secret with: openssl rand -hex 32
    # STEP 2: Use the SAME hex value here and in your .env JWT_SECRET_auth_token
    # IMPORTANT: Replace this placeholder with your actual secret!
    # WARNING: DO NOT USE THIS PLACEHOLDER IN PRODUCTION!
    auth_jwt_key 'PLACEHOLDER_REPLACE_WITH_YOUR_ACTUAL_HEX_SECRET_FROM_OPENSSL';
    
    # JWT algorithm (must match your .env JWT_ALGORITHM setting)
    auth_jwt_algorithm HS256;
    
    # Read JWT from this cookie name
    auth_jwt_location 'COOKIE=auth-token';
    
    # Redirect to auth gateway when JWT is missing/invalid
    auth_jwt_redirect on;
    auth_jwt_loginurl 'http://auth.example.com';

    # ==========================================
    # Auth Gateway Server
    # ==========================================
    # This server proxies requests to the auth gateway application
    # No JWT authentication required here
    
    server {
        listen 80;
        server_name auth.example.com;

        # Disable JWT auth for the auth gateway itself
        auth_jwt_enabled off;

        location / {
            proxy_pass http://auth-gateway:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==========================================
    # Protected Application
    # ==========================================
    # This server requires valid JWT for access
    
    server {
        listen 80;
        server_name app.example.com;

        # Enable JWT authentication
        auth_jwt_enabled on;
        
        # Extract JWT claims as NGINX variables
        auth_jwt_extract_var_claims sub email name subset;

        location / {
            # Proxy to your protected application
            proxy_pass http://demo-app:80;
            
            # Pass JWT claims as headers to your application
            proxy_set_header X-User-ID $jwt_claim_sub;
            proxy_set_header X-User-Email $jwt_claim_email;
            proxy_set_header X-User-Name $jwt_claim_name;
            proxy_set_header X-User-Subset $jwt_claim_subset;
            
            # Standard proxy headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint without authentication
        location /health {
            auth_jwt_enabled off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
