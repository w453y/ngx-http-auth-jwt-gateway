services:
  # Auth Gateway Service
  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-jwt-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3

  # NGINX with JWT Module
  nginx:
    image: w453y/ngx_http_auth_jwt_module:latest
    container_name: auth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - auth-network
    depends_on:
      auth-gateway:
        condition: service_healthy

  # Example Protected Application (optional - replace with your app)
  demo-app:
    image: nginx:alpine
    container_name: demo-app
    restart: unless-stopped
    networks:
      - auth-network
    command: >
      /bin/sh -c "
      echo '<html><head><title>Protected App</title></head><body>
      <h1>Protected Application</h1>
      <p>✅ If you can see this page, JWT authentication is working correctly!</p>
      <p>Your request passed through NGINX JWT validation.</p>
      </body></html>' > /usr/share/nginx/html/index.html && 
      nginx -g 'daemon off;'"

networks:
  auth-network:
    driver: bridge
