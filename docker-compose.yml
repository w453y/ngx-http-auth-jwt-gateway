services:
  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-jwt-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional: NGINX with JWT module for testing
  # Uncomment and configure as needed
  # nginx:
  #   image: nginx:latest
  #   container_name: auth-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #   networks:
  #     - auth-network
  #   depends_on:
  #     - auth-gateway

networks:
  auth-network:
    driver: bridge
